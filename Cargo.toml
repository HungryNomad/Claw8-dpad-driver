[workspace]
resolver = "3"
members = ["driver/common", "driver/dpad", "driver/probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
claw-common = { path = "driver/common" }
uefi = { version = "0.41", features = ["panic_handler"] }
uefi-raw = "0.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
